<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>md-book example</title>
    <!-- FOUC guard: set the theme before first paint. -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('md-book-theme');
          if (m === 'light' || m === 'dark') document.documentElement.setAttribute('data-theme', m);
        } catch (e) {}
      })();
    </script>
    <!-- Optional: md-book prefers Inter / JetBrains Mono when they are available. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/style.css" />
    <!-- Swap in a theme by loading it after style.css: -->
    <!-- <link rel="stylesheet" href="/themes/ink.css" /> -->
  </head>
  <body>
    <!-- The manifest lists the site's locales (md-book dev --locales en,ja): the UI language,
         <html lang>, sidebar, blog and search all follow the language of the current page.
         (On a single-language site, lang="ja" would localise just the generated UI.)
         search / math / mermaid switch on the search box, KaTeX and Mermaid diagrams. -->
    <md-book
      manifest="/manifest.json"
      base="/"
      router="history"
      theme="system"
      blog
      blog-per-page="5"
      search
      math
      mermaid
      site-url="https://md-book.example/"
    >
      <a slot="navbar-end" href="/tags">Tags</a>
    </md-book>
    <script src="/md-book.global.js"></script>
  </body>
</html>
