<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>md-book example</title>
    <!-- FOUC guard: set the theme before first paint. -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('md-book-theme');
          if (m === 'light' || m === 'dark') document.documentElement.setAttribute('data-theme', m);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/style.css" />
    <!-- Swap in a theme by loading it after style.css: -->
    <!-- <link rel="stylesheet" href="/themes/ink.css" /> -->
  </head>
  <body>
    <md-book
      manifest="/manifest.json"
      base="/"
      router="history"
      theme="system"
      blog
      blog-per-page="5"
      site-url="https://md-book.example/"
    >
      <a slot="navbar-end" href="/tags">Tags</a>
    </md-book>
    <script src="/md-book.global.js"></script>
  </body>
</html>
