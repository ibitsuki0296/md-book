version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major bumps (TypeScript, markdown-it, js-yaml, …) change behaviour or
    # types and need a hand-made migration; do those deliberately. Security
    # updates are not affected by `ignore`.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
