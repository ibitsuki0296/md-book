name: Pages

# Publishes examples/docs as a pre-rendered static site (`md-book build`).
# One-time setup: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
      - name: Build the example site
        run: |
          node dist/cli.mjs build examples/docs/content \
            --out _site \
            --base "${{ steps.pages.outputs.base_path }}/" \
            --site-url "${{ steps.pages.outputs.base_url }}/" \
            --title "md-book" \
            --description "A runtime-first Markdown documentation and blog library." \
            --locales en,ja \
            --blog --blog-per-page 5 \
            --search --math --mermaid \
            --theme system
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
