name: Pages

# Publishes examples/docs as a pre-rendered static site (`md-book build`).
# One-time setup: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: npm ci
      - run: npm run build
      - name: Build the example site
        run: |
          node dist/cli.mjs build examples/docs/content \
            --out _site \
            --base "${{ steps.pages.outputs.base_path }}/" \
            --site-url "${{ steps.pages.outputs.base_url }}/" \
            --title "md-book" \
            --description "A runtime-first Markdown documentation and blog library." \
            --locales en,ja \
            --blog --blog-per-page 5 \
            --search --math --mermaid \
            --theme system
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
