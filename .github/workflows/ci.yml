name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run validate:tokens
      - run: npm run size

  release:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Changesets makes a version-bump / changelog commit in this job. git is
    # already checked by the `verify` job, so disable the local lefthook hooks
    # that would otherwise run (and can fail) on that automated commit.
    env:
      LEFTHOOK: "0"
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # The npm bundled with actions/setup-node's Node 24 can be older than
      # 11.5.1, the minimum that knows how to exchange the OIDC token for
      # trusted publishing; an old npm fails with a plain ENEEDAUTH/404
      # instead of a trusted-publishing-specific error. Force a known-good
      # version (matches package.json's `packageManager`).
      - run: npm install -g npm@11.9.0
      - run: npm ci
      - run: npm run build
      - uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
