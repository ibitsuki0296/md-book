name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run validate:tokens
      - run: npm run size

  release:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Changesets makes a version-bump / changelog commit in this job. git is
    # already checked by the `verify` job, so disable the local lefthook hooks
    # that would otherwise run (and can fail) on that automated commit.
    env:
      LEFTHOOK: "0"
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # The npm bundled with actions/setup-node's Node 24 can be older than
      # 11.5.1, the minimum that knows how to exchange the OIDC token for
      # trusted publishing; an old npm fails with a plain ENEEDAUTH/404
      # instead of a trusted-publishing-specific error. Force a known-good
      # version (matches package.json's `packageManager`).
      - run: npm install -g npm@11.9.0
      - run: npm ci
      - run: npm run build
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run version
          publish-script: npm run release
          github-token: ${{ secrets.GITHUB_TOKEN }}
